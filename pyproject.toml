[project]
name = "tinta"
version = "1.1.1"
description = "Tinta, a magical console output tool."
authors = [{ name = "Brandon Shelley", email = "brandon@pacificaviator.co" }]
license = "MIT"
readme = "README.md"
dependencies = []
keywords = [
  "console",
  "colors",
  "ansi",
  "print",
  "term",
  "cli",
  "terminal",
  "development",
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Topic :: Utilities",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[tool.poetry]
name = "tinta"
version = "1.1.1"
description = "Tinta, a magical console output tool."
authors = ["Brandon Shelley <brandon@pacificaviator.co>"]
license = "MIT"
readme = "README.md"

[project.urls]
homepage = "https://github.com/brandonscript/tinta"
repository = "https://github.com/brandonscript/tinta"


[build-system]
requires = ["hatchling", "poetry-core"]
build-backend = "hatchling.build"

[tool.hatchling.build]
packages = ["tinta"]
include = ["tinta/**/*.py", "tinta/**/*.pyi", "tinta/py.typed", "tinta/colors.ini", "/tests"]
exclude = [".*", "dist"]

[tool.hatchling.dependencies]
python = "^3.10 || ^3.11 || ^3.12 || ^3.13 || ^3.14"

[tool.hatchling.dev-dependencies]
pytest = "*"
twine = "*"
wheel = "*"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.mypy-applications]
ignore_missing_imports = false

[tool.mypy-common]
ignore_missing_imports = false
check_untyped_defs = true

[tool.black]
target-version = ['py312']
preview = true

[tool.isort]
profile = "black"
order_by_type = false
combine_as_imports = true
case_sensitive = false
skip_magic_trailing_comma = true
force_sort_within_sections = false

[tool.pyright]
# verboseOutput = true
pythonVersion = "3.12"
extraPaths = [".venv/lib/python3.11/site-packages", "tinta", "**/*.py"]
reportUnusedImport = "error"
reportUnusedClass = "error"
reportUnusedFunction = "error"
reportUnusedVariable = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
preview = true

[tool.ruff.lint]
fixable = ["ALL"]
select = [
  # PRAGMA: F401 is for unused imports, you may want to remove this when developing so you can comment/uncomment code.
  "F401",
  "W292",
  "W293",
  "W191",
  "E101",
  "E112",
  "E117",
  "I002",
  "I001",
  "I002",
  # "UP035",
]
# To add, when supported by ruff: "W503", "E203"
# see: https://github.com/astral-sh/ruff/issues/2402

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"typ.py" = ["F401"]

[tool.ruff.lint.isort]
force-sort-within-sections = false
case-sensitive = false
combine-as-imports = true
force-wrap-aliases = true
order-by-type = false

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
minversion = "7.0"
addopts = "-rP -vv --color=yes --capture=tee-sys"
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
python_classes = ["test_", "_test", "Test*"]
python_functions = ["test_", "_test"]

[tool.poetry.dependencies]
python = "^3.10 || ^3.11 || ^3.12 || ^3.13 || ^3.14"

[tool.poetry.group.dev.dependencies]
ruff = "*"
black = "*"
pytest = "*"
mypy = "*"
pylint = "*"
autopep8 = "*"
pytest-cov = "*"
twine = "*"
hatchling = "*"
setuptools = "*"
wheel = "*"

[tool.hatchling.scripts]
test = "pytest"
build = "./dist/build.sh"
publish-test = "./dist/publish.sh --test"
publish-real = "./dist/publish.sh"
set-version = "./dist/version.sh"
lint-check = "ruff check tinta"
lint-fix = "ruff fix tinta"
